<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>�ang nh?p</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .container {
            text-align: center;
            width: 100%;
        }
        .header, .footer {
            padding: 10px;
            background: #fff;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .login-box {
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
            width: 350px;
            margin: auto;
        }
        .login-box h2 {
            margin-bottom: 15px;
        }
        .login-box label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
        }
        .login-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            text-align: left;
        }
        .checkbox-container input {
            margin-right: 5px;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .forgot {
            color: blue;
            text-decoration: none;
        }
        button {
            background-color: blue;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="#">Home</a> | <a href="#" class="active">Đăng nhập</a> | <a href="#">Đăng Ký</a>
        </div>
        <div class="login-box">
            <h2>Màn hình đăng nhập</h2>
            <form id="loginForm">
                <label for="username">Username</label>
                <input type="text" id="username" required>

                <label for="password">Mật khẩu</label>
                <input type="password" id="password" required>

                <div class="checkbox-container">
                    <input type="checkbox" id="remember">
                    <label for="remember">Ghi nhớ dang nhap</label>
                </div>
                
                <div class="actions">
                    <a href="#" class="forgot">Quen mat khau</a>
                    <button type="submit">dang nhap</button>
                </div>
            </form>
        </div>
        <div class="footer">
            L?p trinh web @01/2024
        </div>
    </div>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            if (username === "admin" && password === "1234") {
                alert("dang nhap thanh cong!");
            } else {
                alert("Sai tai khoan hoac mat khau!");
            }
        });
    </script>
</body>
</html>
